name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "::error::Could not detect Java version."
            exit 1
          fi

          MAJOR_VER=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") print $2; else print $1;}')
          echo "Active Java major version: $MAJOR_VER"
          if [ -z "$MAJOR_VER" ] || [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Active Java major version ($MAJOR_VER) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "./debug.keystore already exists."
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Expected APK not found at $EXPECTED_APK. Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            echo "::error::Expected debug APK ($EXPECTED_APK) does not exist."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::$EXPECTED_APK does not have .apk extension."; exit 1 ;;
          esac

          echo "Confirmed valid APK at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TMP_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$TMP_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-*//;s/-*$//')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="android-app"
          fi

          ASSET_NAME="${CLEAN_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TMP_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset ($ASSET_PATH) is missing or empty."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - **Build Run:** #${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Commit SHA:** ${GITHUB_SHA}
          - **Environment:** Built by GitHub Actions

          > **Notice:** This is an automatically generated debug APK intended for testing. It is signed only with a temporary debug keystore and is not a Play Store production release.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH#$ASSET_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "### Release Publishing Succeeded"
            gh release view "$RELEASE_TAG"

            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            echo "### 🚀 Debug APK Released" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [View Release](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download:** The APK (\`${ASSET_NAME}\`) is directly downloadable under the Assets section of the release." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup:** The standard Actions artifact \`app-debug-apk\` is also preserved in this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or failed. However, the debug APK build and artifact upload succeeded."
            echo "The Actions artifact 'app-debug-apk' remains available for download."

            echo "### ⚠️ Debug APK Built (Release Publishing Warning)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Build Status:** The debug APK was compiled successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "- **GitHub Actions Artifact:** \`app-debug-apk\` was successfully uploaded and is available in the summary section." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Notice:** GitHub Release publishing did not complete. Please download the APK from the workflow's Artifacts section." >> "$GITHUB_STEP_SUMMARY"
          fi
